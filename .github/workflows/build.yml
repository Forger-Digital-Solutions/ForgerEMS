name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ForgerEMS
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ForgerEMS.sln

      - name: Build
        run: dotnet build .\ForgerEMS.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\ForgerEMS.sln -c Release --no-build

      - name: Validate manifests
        run: |
          Get-Content .\manifests\ForgerEMS.updates.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .\manifests\ForgerEMS.updates.schema.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .\manifests\vendor.inventory.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .\manifests\vendor.inventory.schema.json -Raw | ConvertFrom-Json | Out-Null

      - name: Backend offline verification
        run: .\backend\Verify-VentoyCore.ps1

      - name: Release dry run
        # CI runners carry no signing certificate; unsigned output must be opted
        # into explicitly or the signed-by-default gate fails closed.
        run: .\tools\build-release.ps1 -DryRun -UnsignedCandidate

      - name: Upload logs and release dry-run output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgerems-build-output
          path: |
            release/**
            .verify/**
            dist/**
