name = "forgerems-kyra-gateway"
main = "src/index.ts"
compatibility_date = "2026-05-06"

# Keep the public workers.dev URL enabled for beta testing.
workers_dev = true

# Disable generated preview URLs to reduce extra public endpoints.
preview_urls = false

[ai]
binding = "AI"

[vars]
RELEASE_CHANNEL = "preview"
DEFAULT_MODEL = "@cf/openai/gpt-oss-20b"
HEAVY_REASONING_MODEL = "@cf/openai/gpt-oss-120b"
CODING_MODEL = "@cf/qwen/qwen2.5-coder-32b-instruct"
GENERAL_FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
REASONING_FALLBACK_MODEL = "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
MAX_REQUEST_BYTES = "18000"
PROVIDER_TIMEOUT_MS = "45000"
RATE_LIMITS_ENABLED = "false"
BETA_DAILY_TOKEN_LIMIT = "0"
BETA_DAILY_IP_LIMIT = "0"

# Store secrets with:
# wrangler secret put BETA_GATEWAY_TOKEN
# wrangler secret put OPENAI_API_KEY
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put GROQ_API_KEY
#
# Optional later, only if the Worker code supports them:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put MISTRAL_API_KEY
# wrangler secret put CEREBRAS_API_KEY
# wrangler secret put GITHUB_MODELS_TOKEN
#
# Never put real provider keys or gateway beta tokens in this file.
